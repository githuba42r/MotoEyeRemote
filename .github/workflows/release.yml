name: release

# Cut a release on every push to master that contains something releasable.
#
#   plan     -> scripts/semver-bump.sh decides the bump from the conventional
#               commits since the last release, commits version.properties,
#               tags it
#   build    -> signed release APK (when the keystore secrets are present;
#               unsigned otherwise), plus an AAB signed with the Play
#               upload key
#   release  -> one GitHub Release carrying the APK, notes generated inline
#   play     -> AAB to Google Play (internal track by default); gated on
#               the repo variable PLAY_PUBLISH=true
#
# Nothing releasable (docs/chore/style-only commits) => plan reports
# should_release=false and every other job is skipped.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derived from the commits)
        type: choice
        options: [auto, major, minor, patch]
        default: auto
      dry_run:
        description: Build everything, but do not commit, tag or publish
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time; never cancel a release that is mid-flight.
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      code: ${{ steps.bump.outputs.code }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      # Always release from master, whatever ref the run was started on.
      # Full history: the bump script needs the commit that last touched
      # version.properties, which a shallow checkout would hide.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Configure the release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: bump
        name: Bump the version from the commits
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          args=()
          if [ "$BUMP" != "auto" ]; then args+=("$BUMP"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bash scripts/semver-bump.sh "${args[@]}"
      - name: Summarise
        env:
          SHOULD_RELEASE: ${{ steps.bump.outputs.should_release }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ "$SHOULD_RELEASE" = "true" ]; then
            echo "**Releasing ${TAG}**" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "**No release** - nothing releasable since the last version bump." >>"$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The build reads the branch name from nothing in particular, but a
      # detached checkout cannot create signed debug artifacts - stay on a
      # named branch so tooling behaves like a normal local build.
      - name: Build as master
        run: git checkout -B master
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/motoeye-release.keystore"
      - name: Build the release APK (signed when the keystore is present, unsigned otherwise)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK for the release
        run: |
          set -euo pipefail
          src=""
          for candidate in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk; do
            if [ -f "$candidate" ]; then src="$candidate"; break; fi
          done
          test -n "$src"
          test -f "$src"
          mkdir -p artifacts
          cp "$src" "artifacts/motoeye-${VERSION}-release.apk"
          echo "APK source: $src" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          if-no-files-found: error
      # Play gets an AAB signed with the separate upload key (Play App Signing
      # holds the app signing key). Same env vars, different secrets - the
      # Gradle signing config only reads KEYSTORE_*/KEY_*.
      - name: Build the Play AAB (signed with the upload key)
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon bundleRelease
          mkdir -p play
          cp app/build/outputs/bundle/release/app-release.aab "play/motoeye-${VERSION}-release.aab"
          cp app/build/outputs/mapping/release/mapping.txt play/mapping.txt
          rm -f "$RUNNER_TEMP/motoeye-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: play/
          if-no-files-found: error

  # Upload to Google Play. Off until the repo variable PLAY_PUBLISH=true: the
  # first bundle must be uploaded by hand in the Play Console. While the app
  # has never passed review, Play only accepts draft releases, so
  # PLAY_RELEASE_STATUS stays "draft" until then, then becomes "completed".
  play:
    needs: [plan, build]
    if: >-
      needs.plan.outputs.should_release == 'true' &&
      needs.plan.outputs.dry_run != 'true' &&
      vars.PLAY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: play
      - name: Write the "What's new" text
        run: |
          set -euo pipefail
          mkdir -p whatsnew
          prev_tag=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          range="${prev_tag:+${prev_tag}..}${TAG}"
          # Play caps release notes at 500 characters per language.
          git log "$range" --pretty='- %s' --no-merges \
            | grep -v '^- chore(release)' \
            | sed -E 's/^- [a-z]+(\([^)]*\))?!?: /- /' \
            | head -c 495 >whatsnew/whatsnew-en-US || true
          [ -s whatsnew/whatsnew-en-US ] || echo "Bug fixes and improvements." >whatsnew/whatsnew-en-US
          cat whatsnew/whatsnew-en-US >>"$GITHUB_STEP_SUMMARY"
      - uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.a42r.motoeye.remote
          releaseFiles: play/motoeye-${{ needs.plan.outputs.version }}-release.aab
          releaseName: ${{ needs.plan.outputs.version }} (${{ needs.plan.outputs.code }})
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          mappingFile: play/mapping.txt
          whatsNewDirectory: whatsnew

  release:
    needs: [plan, build]
    if: needs.plan.outputs.should_release == 'true' && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts
      - name: Verify the APK asset is present
        run: |
          set -euo pipefail
          assets="artifacts/motoeye-${VERSION}-release.apk"
          test -f "$assets"
          echo "Asset for ${TAG}: $assets" >>"$GITHUB_STEP_SUMMARY"
      - name: Generate the release notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          # Commits since the previous release tag; fall back to recent history.
          prev_tag=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          commits=""
          if [ -n "$prev_tag" ]; then
            commits=$(git log "${prev_tag}..${TAG}" --pretty='- %s' 2>/dev/null || true)
          fi
          if [ -z "$commits" ]; then
            commits=$(git log -10 --pretty='- %s' | grep -v '^- chore(release)' || true)
          fi
          [ -n "$commits" ] || commits='* (no commit-level notes)'
          {
            echo "# MotoEye Remote ${VERSION}"
            echo
            echo "## Downloads"
            echo
            echo "* App APK: \`motoeye-${VERSION}-release.apk\` (sideload; signed release)"
            echo
            echo "## Changes"
            echo
            printf '%s\n' "$commits"
          } >"$notes"
          echo "Notes written to $notes:" >>"$GITHUB_STEP_SUMMARY"
          cat "$notes" >>"$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "MotoEye Remote ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "artifacts/motoeye-${VERSION}-release.apk"
